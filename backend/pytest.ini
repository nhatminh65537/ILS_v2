[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
testpaths =
    api/tests
    auth_app/tests
    realtime/tests

addopts =
    --reuse-db
    --strict-markers
    -q

markers =
    unit: pure unit tests (no DB)
    integration: tests that hit the database
    realtime: websocket and channels protocol tests
    slow: tests that are slow (e.g., full flow tests)
